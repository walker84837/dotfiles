# kitty terminal config
#
# Previously this file was kitty's shipped template with the settings edited in
# place, which meant ~1650 lines of vendored documentation (from kitty 0.35)
# were being carried in git. Only the active settings live here now; run
# `kitty +kitten themes` or consult `man kitty.conf` for documentation.

# Fonts
font_size 10.5
font_family      family='BlexMono Nerd Font' postscript_name=BlexMonoNF-ExtraLight
bold_font        family='BlexMono Nerd Font' style=Regular
italic_font      family='BlexMono Nerd Font' postscript_name=BlexMonoNF-ExtraLightItalic
bold_italic_font family='BlexMono Nerd Font' style=Italic

# Colors are generated from the wallpaper by wallust.
# Template: ~/.config/wallust/templates/colors-kitty.conf
# Route:    ~/.config/wallust/wallust.toml (kitty.template)
include wallust.conf

# Cursor
cursor_trail 1
cursor_trail_decay 0.05 0.2

# Bells
enable_audio_bell no

# Window
remember_window_size  no
draw_minimal_borders yes
window_padding_width 11 11 9 11
placement_strategy center

# Tab bar
tab_bar_style powerline
tab_bar_align left
tab_fade 0.05 0.35 0.7 1
tab_powerline_style round

# $EDITOR used for the scrollback pager (kitty_mod+enter)
editor nvim

# Linux / Wayland
linux_display_server wayland
wayland_enable_ime yes

# Keybindings: kitty_mod is ctrl+shift, since ctrl+shift collides with the IME
# and with common application shortcuts.
kitty_mod ctrl+shift
map kitty_mod+c copy_to_clipboard
map kitty_mod+v paste_from_clipboard
map shift+cmd+]     next_tab
map shift+cmd+[    previous_tab
map kitty_mod+t new_tab
