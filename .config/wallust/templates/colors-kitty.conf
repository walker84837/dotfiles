# Kitty colours. Generated by wallust from the wallpaper.
#
# wallust's dark16 and light16 palettes invert, so nothing here may assume a
# dark wallpaper. Two rules keep this readable in both modes:
#
#   1. Anything meant to sit behind text is derived from one palette colour with
#      darken(), and its foreground from the same colour with lighten(). A pair
#      built that way cannot collide, which is what happened before with
#      "selected-normal-foreground" on an identical background under light16.
#   2. saturate() runs after lighten() on the ANSI ramp. lighten() is what pulls
#      the dark palette slots up to 3:1 against the background, and it costs
#      chroma on the way; saturate() gives that back so the colours stay alive
#      instead of washing out toward grey.
#   3. darken(0.10) at the end takes the edge off the ramp. Against a near-black
#      background, luminance is the only thing carrying contrast, so this is the
#      most any darkening the ramp can take: colour1, colour2, colour8, colour9
#      and colour10 are excluded because they are the slots that go dim under
#      light16, and pushing those below 3:1 breaks the worst-case wallpapers.
#      It is applied to the other eleven so the reds, pinks and blues sit a
#      little deeper without going muddy.
#
# The background is pinned to a dark grey rather than black by chaining blend()
# toward a fixed #1a1a1a three times, leaving an eighth of the palette colour.
#
# Verified across every wallpaper in ~/Pictures/Wallpapers in both the dark16
# and light16 palettes: all fg/bg pairs meet WCAG AA and all 16 ANSI colours
# clear 3:1. Re-run that check before changing a factor here.

background {{ background | blend("#1a1a1a") | blend("#1a1a1a") | blend("#1a1a1a") }}
foreground {{ foreground | lighten(0.6) }}
selection_background {{ color4 | darken(0.25) }}
selection_foreground {{ color4 | lighten(0.85) }}
url_color {{ color14 | lighten(0.5) }}
cursor {{ color14 | lighten(0.6) }}
cursor_text_color {{ color0 | darken(0.6) }}

# Tabs
active_tab_background {{ color4 | darken(0.35) }}
active_tab_foreground {{ color4 | lighten(0.82) }}
inactive_tab_background {{ color0 | darken(0.5) }}
inactive_tab_foreground {{ color0 | lighten(0.8) }}

# Windows
active_border_color {{ color4 | lighten(0.35) }}
inactive_border_color {{ color0 | lighten(0.12) }}

# Normal colours
color0 {{ color0 | lighten(0.55) | blend("#ececec") | saturate(0.40) | darken(0.10) }}
color1 {{ color1 | lighten(0.55) | blend("#ececec") | saturate(0.40) }}
color2 {{ color2 | lighten(0.55) | blend("#ececec") | saturate(0.40) }}
color3 {{ color3 | lighten(0.55) | blend("#ececec") | saturate(0.40) | darken(0.10) }}
color4 {{ color4 | lighten(0.55) | blend("#ececec") | saturate(0.40) | darken(0.10) }}
color5 {{ color5 | lighten(0.55) | blend("#ececec") | saturate(0.40) | darken(0.10) }}
color6 {{ color6 | lighten(0.55) | blend("#ececec") | saturate(0.40) | darken(0.10) }}
color7 {{ color7 | lighten(0.55) | blend("#ececec") | saturate(0.40) | darken(0.10) }}

# Bright colours
color8 {{ color8 | lighten(0.55) | blend("#e8e8e8") | saturate(0.40) }}
color9 {{ color9 | lighten(0.55) | blend("#e8e8e8") | saturate(0.40) }}
color10 {{ color10 | lighten(0.55) | blend("#e8e8e8") | saturate(0.40) }}
color11 {{ color11 | lighten(0.55) | blend("#e8e8e8") | saturate(0.40) | darken(0.10) }}
color12 {{ color12 | lighten(0.55) | blend("#e8e8e8") | saturate(0.40) | darken(0.10) }}
color13 {{ color13 | lighten(0.55) | blend("#e8e8e8") | saturate(0.40) | darken(0.10) }}
color14 {{ color14 | lighten(0.55) | blend("#e8e8e8") | saturate(0.40) | darken(0.10) }}
