source = $HOME/.config/hypr/wallust/wallust-hyprland.conf
$font_monospace = JetBrainsMono Nerd Font Mono ExtraBold
$font_sans_serif = Roboto Medium
$lock_wallpaper = $HOME/Pictures/Wallpapers/Unsplash/john-towner-JgOeRuGD_Y4-unsplash.png

general {
    grace = 1
}

background {
    monitor =
    path = $lock_wallpaper

    blur_size = 5
    blur_passes = 1
    noise = 0.0117
    contrast = 1.3000
    brightness = 0.8000
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 200, 30
    outline_thickness = 3
    dots_size = 0.33 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.15 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = $color5
    inner_color = $color0
    font_color = $color8
    fade_on_empty = true
    placeholder_text = <i>Password...</i> # Text rendered in the input box when it's empty.
    hide_input = false
    
    position = 0, 200
    halign = center
    valign = bottom
}

# Date
label {
    monitor =
    text = cmd[update:18000000] echo "<b> "$(date +'%A, %-d %B %Y')" </b>"
    color = $foreground
    font_size = 34
    font_family = $font_monospace
    position = 0, -100
    halign = center
    valign = top
}

# Hour-Time
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%H")"
    color = $color7
    font_size = 200
    font_family = $font_monospace
    position = 0, -200
    halign = center
    valign = top
}

# Minute-Time
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%M")"
    color = $color12
    font_size = 200
    font_family = $font_monospace
    position = 0, -500
    halign = center
    valign = top
}

# Seconds-Time
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%S")"
    color = $color12
    font_size = 40
    font_family = $font_monospace
    position = 0, -500
    halign = center
    valign = top
}

# User
label {
    monitor =
    text =    $USER
    color = $color12
    font_size = 18
    font_family = $font_sans_serif

    position = 0, 100
    halign = center
    valign = bottom
}

# uptime
label {
    monitor =
    text = cmd[update:60000] echo "<b> "$(uptime -p)" </b>"
    color = $color12
    font_size = 24
    font_family = $font_monospace
    position = 0, 0
    halign = right
    valign = bottom
}

label {
    monitor =
    text = cmd[update:3600000] [ -f ~/.cache/.weather_cache ] && cat  ~/.cache/.weather_cache
    color = $color12
    font_size = 24
    font_family = $font_monospace
    position = 50, 0
    halign = left
    valign = bottom
}
