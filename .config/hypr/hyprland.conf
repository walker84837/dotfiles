# Sourcing external config files
# Reference config: kept alongside the Lua port in lua_configs/ while the
# migration is in progress. Hyprland loads hyprland.lua in preference to this
# file when both are present, so nothing here is active at runtime.
# Default Configs
$configs = $HOME/dotfiles/.config/hypr/configs

source = $configs/keybinds.conf
source = $configs/startup_apps.conf
source = $configs/env.conf
source = $configs/monitors.conf
source = $configs/window_rules.conf
source = $configs/user_keybinds.conf
source = $configs/user_settings.conf
source = $configs/workspace_rules.conf

#source = $configs/Laptops.conf
#source = $configs/LaptopDisplay.conf
