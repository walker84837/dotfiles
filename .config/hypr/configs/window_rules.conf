# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
#windowrule = noblur,gamescope
#windowrule = fullscreen,gamescope
#windowrule = workspace 6 silent,^(gamescope)$

# windowrule center
# windowrule = center,^(pavucontrol|org.pulseaudio.pavucontrol)
# windowrule = center,^([Ww]hatsapp-for-linux)$
# windowrule = center,^([Ff]erdium)$

misc:enable_anr_dialog = false

# WINDOWRULE v2 -> converted to new syntax (windowrule)
# windowrule v2 - position
# windowrulev2 = center,floating:1 # warning, it cause even the menu to float and center.
windowrule = match:class ^([Tt]hunar)$, match:title ^(File Operation Progress)$, center on
windowrule = match:class ^([Tt]hunar)$, match:title ^(Confirm to replace files)$, center on

windowrule = match:fullscreen 1, idle_inhibit fullscreen

# windowrule v2 - float
windowrule = match:class ^(org.kde.polkit-kde-authentication-agent-1)$, float on
windowrule = match:class ^([Zz]oom|onedriver|onedriver-launcher)$, float on
windowrule = match:class ^([Tt]hunar)$, match:title ^(File Operation Progress)$, float on
windowrule = match:class ^([Tt]hunar)$, match:title ^(Confirm to replace files)$, float on
windowrule = match:class ^(xdg-desktop-portal-gtk)$, float on
windowrule = match:class ^(org.gnome.Calculator)$, match:title ^(Calculator)$, float on
windowrule = match:class ^(codium|codium-url-handler|VSCodium)$, match:title ^(Add Folder to Workspace)$, float on
windowrule = match:class ^([Rr]ofi)$, float on
windowrule = match:class ^(eog)$, float on
windowrule = match:class ^(pavucontrol|org.pulseaudio.pavucontrol)$, float on
windowrule = match:class ^(nwg-look|qt5ct|qt6ct|mpv)$, float on
windowrule = match:class ^(nm-applet|nm-connection-editor|blueman-manager)$, float on
windowrule = match:class ^(gnome-system-monitor|org.gnome.SystemMonitor)$, float on   # system monitor
windowrule = match:class ^(yad)$, float on   # icon browser
windowrule = match:class ^(wihotspot-gui)$, float on   # wifi hotspot
windowrule = match:class ^(evince)$, float on   # document viewer
windowrule = match:class ^(file-roller|org.gnome.FileRoller)$, float on   # archive manager
windowrule = match:class ^([Bb]aobab|org.gnome.[Bb]aobab)$, float on   # Disk usage analyzer
windowrule = match:title ^(Kvantum Manager)$, float on
#windowrule = match:class ^([Ss]team)$,match:title ^((?![Ss]team).*|[Ss]team [Ss]ettings)$, float on
windowrule = match:class ^([Qq]alculate-gtk)$, float on
windowrule = match:class ^([Ww]hatsapp-for-linux)$, float on
windowrule = match:class ^([Ff]erdium)$, float on

# windowrule v2 - opacity #enable as desired
windowrule = match:class ^([Rr]ofi)$, opacity 0.9 0.6
windowrule = match:class ^(Brave-browser(-beta|-dev)?)$, opacity 0.9 0.7
windowrule = match:class ^([Ff]irefox|org.mozilla.firefox|[Ff]irefox-esr)$, opacity 0.9 0.7
windowrule = match:class ^([Tt]horium-browser)$, opacity 0.9 0.6
windowrule = match:class ^([Mm]icrosoft-edge(-stable|-beta|-dev|-unstable)?)$, opacity 0.9 0.8
windowrule = match:class ^(google-chrome(-beta|-dev|-unstable)?)$, opacity 0.9 0.8
windowrule = match:class ^(chrome-.+-Default)$, opacity 0.94 0.86   # Chrome PWAs
windowrule = match:class ^([Tt]hunar)$, opacity 0.9 0.8
windowrule = match:class ^(pcmanfm-qt)$, opacity 0.8 0.6
windowrule = match:class ^(gedit|org.gnome.TextEditor)$, opacity 0.8 0.7
windowrule = match:class ^(deluge)$, opacity 0.9 0.8
windowrule = match:class ^(Alacritty)$, opacity 0.9 0.8
windowrule = match:class ^(kitty)$, opacity 0.8 0.7
windowrule = match:class ^(mousepad)$, opacity 0.9 0.7
windowrule = match:class ^(VSCodium|codium-url-handler)$, opacity 0.9 0.7
windowrule = match:class ^(nwg-look|qt5ct|qt6ct|yad)$, opacity 0.9 0.8
windowrule = match:title ^(Kvantum Manager)$, opacity 0.9 0.8
windowrule = match:class ^(com.obsproject.Studio)$, opacity 0.9 0.7
windowrule = match:class ^([Aa]udacious)$, opacity 0.9 0.7
windowrule = match:class ^(org.gnome.Nautilus)$, opacity 0.9 0.8
windowrule = match:class ^(VSCode|code-url-handler)$, opacity 0.9 0.8
windowrule = match:class ^(jetbrains-.+)$, opacity 0.9 0.8   # JetBrains IDEs
windowrule = match:class ^([Dd]iscord|[Vv]esktop)$, opacity 0.86 0.70
windowrule = match:class ^(org.telegram.desktop|io.github.tdesktop_x64.TDesktop)$, opacity 0.9 0.8
windowrule = match:class ^(gnome-disks|evince|wihotspot-gui|org.gnome.baobab)$, opacity 0.94 0.86
windowrule = match:class ^(file-roller|org.gnome.FileRoller)$, opacity 0.9 0.8   # archive manager
windowrule = match:class ^(app.drey.Warp)$, opacity 0.8 0.7   # Warp file transfer
windowrule = match:class ^(seahorse)$, opacity 0.9 0.8   # gnome-keyring gui
windowrule = match:class ^(gnome-system-monitor|org.gnome.SystemMonitor)$, opacity 0.82 0.75
windowrule = match:class ^(xdg-desktop-portal-gtk)$, opacity 0.9 0.8   # gnome-keyring gui
windowrule = match:class ^([Ww]hatsapp-for-linux)$, opacity 0.9 0.7
windowrule = match:class ^([Ff]erdium)$, opacity 0.9 0.7

# windowrule v2 - size
windowrule = match:class ^(gnome-system-monitor|org.gnome.SystemMonitor)$, size 70% 70%
windowrule = match:class ^(xdg-desktop-portal-gtk)$, size 70% 70%
windowrule = match:title ^(Kvantum Manager)$, size 60% 70%
windowrule = match:class ^(qt6ct)$, size 60% 70%
windowrule = match:class ^(evince|wihotspot-gui)$, size 70% 70%
windowrule = match:class ^(file-roller|org.gnome.FileRoller)$, size 60% 70%
windowrule = match:class ^([Ww]hatsapp-for-linux)$, size 60% 70%
windowrule = match:class ^([Ff]erdium)$, size 60% 70%

#layerrule = unset,class:^([Rr]ofi)$
#layerrule = blur,class:^([Rr]ofi)$
#layerrule = ignorezero, <rofi>

layerrule = match:namespace ^overview$, blur on, ignore_alpha 0

#windowrule = bordercolor rgb(EE4B55) rgb(880808), fullscreen:1
#windowrule = bordercolor rgb(282737) rgb(1E1D2D), floating:1
#windowrule = opacity 0.8 0.8, pinned:1

# Picture-in-a-Picture (PIP) rules: Oddly, some need re-duplication.  This is because the window for
# PIP changes after on first launch, and will not inherant the rules...
windowrule = match:title ^(Picture-in-Picture)$, opacity 0.95 0.75   # for opacity: [focus num] [bg num]
# Interestingly, the opacity rule above doesn't need the reduplication?
windowrule = match:title ^(Picture-in-Picture)$, pin on
#windowrule = match:title ^(Firefox)$, pin on
windowrule = match:title ^(Picture-in-Picture)$, float on
#windowrule = match:title ^(Firefox)$, float on
windowrule = match:title ^(Picture-in-Picture)$, size 25% 25%
#windowrule = match:title ^(Firefox)$, size 25% 25%
windowrule = match:title ^(Picture-in-Picture)$, move 72% 7%
#windowrule = match:title ^(Firefox)$, move 72% 7%

# From https://wiki.hyprland.org/Useful-Utilities/Screen-Sharing/#xwayland
windowrule = match:class ^(xwaylandvideobridge)$, opacity 0.0 override
windowrule = match:class ^(xwaylandvideobridge)$, no_anim on
windowrule = match:class ^(xwaylandvideobridge)$, no_initial_focus on
windowrule = match:class ^(xwaylandvideobridge)$, max_size 1 1
windowrule = match:class ^(xwaylandvideobridge)$, no_blur on
windowrule = match:class ^(xwaylandvideobridge)$, no_focus on

# gromit-mpx
workspace = special:gromit, gapsin:0, gapsout:0, on-created-empty: gromit-mpx -a

windowrule = match:class ^(Gromit-mpx)$, float on
windowrule = match:class ^(Gromit-mpx)$, fullscreen_state 2 2

# 2. Disable blur & shadows
windowrule = match:class ^(Gromit-mpx)$, no_blur on
windowrule = match:class ^(Gromit-mpx)$, no_shadow on

# 3. Force it to 100% size (in case fullscreenstate alone doesn’t stretch it)
windowrule = match:class ^(Gromit-mpx)$, size 100% 100%
